<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Dashboard | WAYTRIP</title>
  <link rel="icon" href="favicon.png" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="flex min-h-screen bg-light-2">
    <aside class="w-72 bg-white p-6 shadow-[0_10px_30px_0_#05103608]">
      <a href="index.html" class="mb-8 block"><img src="src/images/general/logo-dark.svg" class="w-[140px]" alt="Logo"></a>
      <p class="text-dark-1 text-sm font-semibold" data-crm-user-name>CRM User</p>
      <p class="text-light-1 mb-6 text-xs" data-crm-user-email>crm@example.com</p>
      <nav class="space-y-2 text-sm">
        <a href="crm-dashboard.html" class="block rounded bg-blue-1/10 px-3 py-2 text-blue-1">CRM Dashboard</a>
        <a href="crm-bookings.html" class="block rounded px-3 py-2 hover:bg-light-2">Booking Management</a>
        <a href="crm-users.html" class="block rounded px-3 py-2 hover:bg-light-2">User Management</a>
      </nav>
    </aside>

    <main class="flex-1 p-8">
      <h1 class="text-dark-1 mb-6 text-3xl font-semibold">CRM Dashboard</h1>
      <div class="grid gap-6 sm:grid-cols-3">
        <div class="rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]">
          <p class="text-light-1 text-sm">Total Bookings</p>
          <h2 id="crm-total-bookings" class="text-dark-1 mt-2 text-3xl font-semibold">0</h2>
        </div>
        <div class="rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]">
          <p class="text-light-1 text-sm">Upcoming</p>
          <h2 id="crm-upcoming" class="text-dark-1 mt-2 text-3xl font-semibold">0</h2>
        </div>
        <div class="rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]">
          <p class="text-light-1 text-sm">Completed</p>
          <h2 id="crm-completed" class="text-dark-1 mt-2 text-3xl font-semibold">0</h2>
        </div>
      </div>
    </main>
  </div>
  <script defer src="crm-auth-guard.js"></script>
  <script defer src="crm-dashboard.js"></script>
</body>
</html>
