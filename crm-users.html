<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM User Management | WAYTRIP</title>
  <link rel="icon" href="favicon.png" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="flex min-h-screen bg-light-2">
    <aside class="w-72 bg-white p-6 shadow-[0_10px_30px_0_#05103608]">
      <a href="index.html" class="mb-8 block"><img src="src/images/general/logo-dark.svg" class="w-[140px]" alt="Logo"></a>
      <p class="text-dark-1 text-sm font-semibold" data-crm-user-name>CRM User</p>
      <p class="text-light-1 mb-6 text-xs" data-crm-user-email>crm@example.com</p>
      <nav class="space-y-2 text-sm">
        <a href="crm-dashboard.html" class="block rounded px-3 py-2 hover:bg-light-2">CRM Dashboard</a>
        <a href="crm-bookings.html" class="block rounded px-3 py-2 hover:bg-light-2">Booking Management</a>
        <a href="crm-users.html" class="block rounded bg-blue-1/10 px-3 py-2 text-blue-1">User Management</a>
      </nav>
    </aside>

    <main class="flex-1 p-8">
      <div class="mb-4 flex items-center gap-3">
        <h1 class="text-dark-1 text-3xl font-semibold">User Management</h1>
        <input id="crm-user-search" placeholder="Search users" class="border-border h-10 rounded border px-3 text-sm" />
        <button id="crm-user-search-btn" class="bg-blue-1 rounded px-4 py-2 text-sm text-white">Search</button>
      </div>
      <div class="rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]">
        <div id="crm-users-list" class="space-y-4">
          <p class="text-light-1 text-sm">Loading users...</p>
        </div>
      </div>
      <div class="mt-6 rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]">
        <h2 class="text-dark-1 mb-3 text-xl font-semibold">User Travel History</h2>
        <div id="crm-user-history" class="text-light-1 text-sm">Select a user to view travel history.</div>
      </div>
    </main>
  </div>
  <script defer src="crm-auth-guard.js"></script>
  <script defer src="crm-users.js"></script>
</body>
</html>
