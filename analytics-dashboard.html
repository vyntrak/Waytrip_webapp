<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Dashboard | WAYTRIP</title>
  <link rel="icon" href="favicon.png" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="min-h-screen bg-light-2 p-8">
    <div class="mb-8 flex items-center justify-between">
      <h1 class="text-dark-1 text-3xl font-semibold">Analytics Dashboard</h1>
      <a href="dashboard.html" class="text-blue-1 text-sm font-medium">Back to Dashboard</a>
    </div>

    <div class="mb-6 rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]">
      <p class="text-light-1 text-sm">Total Users</p>
      <h2 id="analytics-total-users" class="text-dark-1 mt-2 text-4xl font-semibold">0</h2>
    </div>

    <div class="grid gap-6 lg:grid-cols-2">
      <div class="rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]"><canvas id="bookingsPerMonthChart"></canvas></div>
      <div class="rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]"><canvas id="revenueGrowthChart"></canvas></div>
      <div class="rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]"><canvas id="popularDestinationsChart"></canvas></div>
      <div class="rounded bg-white p-6 shadow-[0_10px_30px_0_#05103608]"><canvas id="packagePerformanceChart"></canvas></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="analytics-auth-guard.js"></script>
  <script defer src="analytics-dashboard.js"></script>
</body>
</html>
